name: CI

# Starter workflow for IPI org repositories.
# It delegates build/test/lint and security scanning to the org-wide reusable
# workflows in ipicoin/.github. Adjust the `with:` inputs to match your repo.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    uses: ipicoin/.github/.github/workflows/reusable-ci.yml@main

  codeql:
    name: CodeQL
    uses: ipicoin/.github/.github/workflows/reusable-codeql.yml@main
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    with:
      languages: '["javascript-typescript"]'

  security:
    name: Security
    uses: ipicoin/.github/.github/workflows/reusable-security.yml@main
    # A called reusable workflow cannot be granted more than the caller's job
    # permissions. Without pull-requests: write here, the dependency-review job
    # inside reusable-security.yml is capped by the workflow-level contents: read
    # and fails with 403 when it tries to comment on the PR.
    permissions:
      contents: read
      pull-requests: write
    with:
      enable-dependency-review: true
      enable-secret-scan: true
      enable-sonar: false
